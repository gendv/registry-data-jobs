name: Australia ABN register (monthly)

on:
  schedule:
    - cron: "41 4 8 * *"
  workflow_dispatch:
    inputs:
      record_limit:
        description: "Stop after this many records (0 = all). Use 2000 for a test run."
        default: "0"
      skip:
        description: "Records already loaded (set automatically when a long run continues)"
        default: "0"
      source_id:
        description: "File the chain started on (set automatically when a long run continues)"
        default: ""
      cutoff:
        description: "Cancelled ABNs dated on or after this day are sent (YYYY-MM-DD, or 'all' as a manual override). Empty = date of the last complete run minus 14 days, else 2026-09-14. Set automatically when a long run continues"
        default: ""
      max_nonact:
        description: "Stop before sending if more cancelled records than this pass the cutoff (default 500000)"
        default: ""
      nonact_count:
        description: "Cancelled records counted by the first run of the chain (set automatically)"
        default: ""
      chain_date:
        description: "Day the chain started (set automatically)"
        default: ""
      changed_same:
        description: "Equal-date updates so far in this chain (set automatically)"
        default: ""
      count_only:
        description: "1 = only parse the file and log counts; no database connection, nothing is sent"
        default: ""

permissions:
  contents: read
  actions: write

concurrency:
  group: bulk-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run job
        working-directory: jobs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RECORD_LIMIT: ${{ github.event.inputs.record_limit || '0' }}
          SKIP: ${{ github.event.inputs.skip || '0' }}
          SOURCE_ID: ${{ github.event.inputs.source_id || '' }}
          CUTOFF: ${{ github.event.inputs.cutoff || '' }}
          MAX_NONACT: ${{ github.event.inputs.max_nonact || '' }}
          NONACT_COUNT: ${{ github.event.inputs.nonact_count || '' }}
          CHAIN_DATE: ${{ github.event.inputs.chain_date || '' }}
          CHANGED_SAME: ${{ github.event.inputs.changed_same || '' }}
          COUNT_ONLY: ${{ github.event.inputs.count_only || '' }}
          GITHUB_TOKEN: ${{ github.token }}

        run: python abn_bulk.py
